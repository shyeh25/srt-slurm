name: "disagg-b200-8k1k-low-latency-1p1d-tp8-tp8-mtp"

frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 8

dynamo:
  hash: "86f84b9486905c2bfaa4b756c9fa39f04ecf5ebd"
  install: true

model:
  path: "deepseek-v4-pro"
  container: "lmsysorg/sglang:nightly-dev-cu13-20260801-e4c4faf8"
  precision: "fp4"

sbatch_directives:
  cpus-per-task: "144"
  mem: "0"

resources:
  gpu_type: "b200"
  gpus_per_node: 8
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 8
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 8

health_check:
  max_attempts: 300

backend:
  type: sglang

  prefill_environment:
    PYTHONUNBUFFERED: "1"
    UCX_TLS: "rc_x,cuda_copy,cuda_ipc,tcp"
    UCX_NET_DEVICES: "rocep145s0:1,rocep146s0:1,rocep152s0:1,rocep153s0:1,rocep198s0:1,rocep199s0:1,rocep205s0:1,rocep206s0:1"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_IB_GPU_DIRECT_RDMA: "n"
    SGLANG_RADIX_FORCE_MISS: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
    SGLANG_DEFAULT_THINKING: "1"
    SGLANG_DSV4_REASONING_EFFORT: "max"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
    SGLANG_OPT_SWA_EVICT_DROP_PAGE_MARGIN: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"

  decode_environment:
    PYTHONUNBUFFERED: "1"
    UCX_TLS: "rc_x,cuda_copy,cuda_ipc,tcp"
    UCX_NET_DEVICES: "rocep145s0:1,rocep146s0:1,rocep152s0:1,rocep153s0:1,rocep198s0:1,rocep199s0:1,rocep205s0:1,rocep206s0:1"
    UCX_MEMTYPE_CACHE: "n"
    UCX_MEMTYPE_REG_WHOLE: "n"
    UCX_IB_GPU_DIRECT_RDMA: "n"
    SGLANG_RADIX_FORCE_MISS: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
    SGLANG_DEFAULT_THINKING: "1"
    SGLANG_DSV4_REASONING_EFFORT: "max"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
    SGLANG_OPT_SWA_EVICT_DROP_PAGE_MARGIN: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"

  sglang_config:
    prefill:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      model-path: "/model/"
      trust-remote-code: true
      tool-call-parser: deepseekv4

      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: nixl
      disaggregation-ib-device: "rocep145s0,rocep146s0,rocep152s0,rocep153s0,rocep198s0,rocep199s0,rocep205s0,rocep206s0"
      weight-loader-prefetch-checkpoints: true
      weight-loader-prefetch-num-threads: 8
      model-loader-extra-config: '{"enable_multithread_load": true}'

      tensor-parallel-size: 8
      data-parallel-size: 1
      expert-parallel-size: 1

      moe-runner-backend: "flashinfer_mxfp4"
      disable-flashinfer-autotune: true

      mem-fraction-static: 0.9
      max-running-requests: 16
      cuda-graph-max-bs: 8
      chunked-prefill-size: 65536

    decode:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      model-path: "/model/"
      trust-remote-code: true
      tool-call-parser: deepseekv4

      disaggregation-mode: "decode"
      disaggregation-transfer-backend: nixl
      disaggregation-ib-device: "rocep145s0,rocep146s0,rocep152s0,rocep153s0,rocep198s0,rocep199s0,rocep205s0,rocep206s0"
      weight-loader-prefetch-checkpoints: true
      weight-loader-prefetch-num-threads: 8
      model-loader-extra-config: '{"enable_multithread_load": true}'

      tensor-parallel-size: 8
      data-parallel-size: 1
      expert-parallel-size: 1

      moe-runner-backend: "flashinfer_mxfp4"
      disable-flashinfer-autotune: true

      speculative-algo: "EAGLE"
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4

      mem-fraction-static: 0.9
      max-running-requests: 8
      cuda-graph-max-bs: 8
      swa-full-tokens-ratio: 0.1
      context-length: 16384

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  random_range_ratio: 0.8
  concurrencies: "1"
  req_rate: "inf"
  use_chat_template: true
  custom_tokenizer: "sa_bench_tokenizers.sglang_deepseek_v4.SGLangDeepseekV4Tokenizer"
