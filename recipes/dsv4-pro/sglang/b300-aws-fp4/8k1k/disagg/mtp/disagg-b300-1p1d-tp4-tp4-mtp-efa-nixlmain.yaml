name: "disagg-b300-1p1d-tp4-tp4-mtp"

health_check:
  max_attempts: 720
  interval_seconds: 10

frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 8

dynamo:
  hash: "86f84b9486905c2bfaa4b756c9fa39f04ecf5ebd"
  install: true

model:
  path: "deepseek-v4-pro"
  container: "/lustre/fsw/portfolios/coreai/users/shuhaoy/docker_cache/lmsysorg/sglang:nightly-dev-cu13-20260801-e4c4faf8-efa149-nixlmain.sqsh"
  precision: "fp4"

slurm:
  time_limit: "02:00:00"

resources:
  gpu_type: "b300"
  gpus_per_node: 8
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 4
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 4

backend:
  type: sglang

  prefill_environment:
    PYTHONUNBUFFERED: "1"
    SGLANG_RADIX_FORCE_MISS: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
    SGLANG_DEFAULT_THINKING: "1"
    SGLANG_DSV4_REASONING_EFFORT: "max"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    MC_FORCE_MNNVL: "1"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"
    SGLANG_DISAGGREGATION_NIXL_BACKEND: "LIBFABRIC"
    FI_PROVIDER: "efa"
    FI_EFA_USE_DEVICE_RDMA: "1"
    FI_EFA_ENABLE_SHM_TRANSFER: "0"
    FI_LOG_LEVEL: "warn"

  decode_environment:
    PYTHONUNBUFFERED: "1"
    SGLANG_RADIX_FORCE_MISS: "1"
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "1"
    SGLANG_DEFAULT_THINKING: "1"
    SGLANG_DSV4_REASONING_EFFORT: "max"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    MC_FORCE_MNNVL: "1"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"
    SGLANG_DISAGGREGATION_NIXL_BACKEND: "LIBFABRIC"
    FI_PROVIDER: "efa"
    FI_EFA_USE_DEVICE_RDMA: "1"
    FI_EFA_ENABLE_SHM_TRANSFER: "0"
    FI_LOG_LEVEL: "warn"

  sglang_config:
    prefill:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      model-path: "/model/"
      trust-remote-code: true
      tool-call-parser: deepseekv4

      disaggregation-mode: "prefill"
      watchdog-timeout: 86400
      disaggregation-transfer-backend: nixl

      tensor-parallel-size: 4
      data-parallel-size: 1
      expert-parallel-size: 1

      moe-runner-backend: "flashinfer_mxfp4"
      disable-flashinfer-autotune: true

      mem-fraction-static: 0.9
      max-running-requests: 8
      cuda-graph-max-bs: 8
      chunked-prefill-size: 32768


    decode:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      model-path: "/model/"
      trust-remote-code: true
      tool-call-parser: deepseekv4

      disaggregation-mode: "decode"
      watchdog-timeout: 86400
      disaggregation-transfer-backend: nixl

      tensor-parallel-size: 4
      data-parallel-size: 1
      expert-parallel-size: 1

      moe-runner-backend: "flashinfer_mxfp4"
      disable-flashinfer-autotune: true

      speculative-algo: "EAGLE"
      speculative-num-steps: 3
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4

      mem-fraction-static: 0.9
      max-running-requests: 8
      cuda-graph-max-bs: 8
      swa-full-tokens-ratio: 0.1
      context-length: 16384


benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  random_range_ratio: 0.8
  concurrencies: "1"
  req_rate: "inf"
  use_chat_template: true
  custom_tokenizer: "sa_bench_tokenizers.sglang_deepseek_v4.SGLangDeepseekV4Tokenizer"
