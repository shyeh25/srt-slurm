name: "dsv4-pro-gb200-disagg-1k1k-1p1d-dep8-tp8"

slurm:
  time_limit: "03:00:00"

sbatch_directives:
  cpus-per-task: '144'
  mem: '0'

dynamo:
  hash: "92f5b3b8d7dd5ab9179d4b1034bd2c1c0803693e"
  install: true

frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 8
  env:
    DYN_ROUTER_LOAD_BLOCK_SIZE: "1"
  args:
    router-mode: "kv"
    router-kv-overlap-score-weight: 0
    router-queue-threshold: 64
    router-temperature: 0.5
    no-kv-events: true

model:
  path: "dsv4-pro"
  container: "lmsysorg/sglang:nightly-dev-cu13-20260525-ed179bf9"
  precision: "mxfp4"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  prefill_nodes: 2
  prefill_workers: 1
  gpus_per_prefill: 8
  decode_nodes: 2
  decode_workers: 1
  gpus_per_decode: 8

backend:
  type: sglang

  prefill_environment:
    PYTHONUNBUFFERED: "1"
    SGLANG_JIT_DEEPGEMM_PRECOMPILE: "0"
    SGLANG_ENABLE_THINKING: "1"
    SGLANG_REASONING_EFFORT: "max"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"

    SGLANG_OPT_SWA_EVICT_DROP_PAGE_MARGIN: "1"
    SGLANG_OPT_USE_DEEPGEMM_MEGA_MOE: "1"
    SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "9216"
    SGLANG_OPT_FIX_MEGA_MOE_MEMORY: "1"
    SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "0"

    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    MC_FORCE_MNNVL: "1"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"

  decode_environment:
    PYTHONUNBUFFERED: "1"
    SGLANG_JIT_DEEPGEMM_PRECOMPILE: "0"
    SGLANG_ENABLE_THINKING: "1"
    SGLANG_REASONING_EFFORT: "max"
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    MC_FORCE_MNNVL: "1"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: "1"

  sglang_config:
    prefill:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      model-path: "/model/"
      trust-remote-code: true
      disable-radix-cache: true

      disaggregation-mode: "prefill"
      disaggregation-transfer-backend: mooncake

      tensor-parallel-size: 8
      data-parallel-size: 8
      expert-parallel-size: 8

      enable-dp-attention: true
      enable-dp-lm-head: true

      moe-a2a-backend: "deepep"
      deepep-config: '{"normal_dispatch":{"num_sms":96},"normal_combine":{"num_sms":96}}'

      mem-fraction-static: 0.90
      max-running-requests: 1024
      cuda-graph-max-bs: 512
      chunked-prefill-size: 8192

    decode:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      model-path: "/model/"
      trust-remote-code: true
      disable-radix-cache: true

      disaggregation-mode: "decode"
      disaggregation-transfer-backend: mooncake

      tensor-parallel-size: 8
      data-parallel-size:   1
      expert-parallel-size: 1

      moe-runner-backend: "flashinfer_mxfp4"
      disable-flashinfer-autotune: true

      mem-fraction-static: 0.9
      max-running-requests: 8
      cuda-graph-max-bs:    8
      swa-full-tokens-ratio: 0.1
      context-length: 4096

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  random_range_ratio: 0.8
  concurrencies: "1"
  req_rate: "inf"
  use_chat_template: false

